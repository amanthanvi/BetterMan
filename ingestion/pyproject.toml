[project]
name = "betterman-ingestion"
version = "0.1.0"
description = "BetterMan ingestion pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "beautifulsoup4>=4.15.0",
  "pydantic>=2.13.4",
]

# Containers and the FreeBSD runner `pip install` this directory. Name the
# package, so data/ (pins read from the checkout) is not taken for a second one.
[tool.setuptools.packages.find]
include = ["ingestion", "ingestion.*"]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=6.0.0",
  "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ingestion --cov-report=term-missing:skip-covered --cov-fail-under=60"
