name: update-dataset

on:
  workflow_dispatch:
    inputs:
      ingest:
        description: Run ingestion into staging DB
        type: boolean
        required: false
        default: true
      linux:
        description: Run Linux container ingests (debian/ubuntu/fedora/arch/alpine)
        type: boolean
        required: false
        default: true
      bsd:
        description: Run BSD ingests (freebsd/macos)
        type: boolean
        required: false
        default: true
      bsd_distro:
        description: BSD distro to ingest (workflow_dispatch only)
        type: choice
        required: false
        default: all
        # Keep choices aligned with BETTERMAN_BSD_DISTROS below; GitHub Actions
        # does not allow expressions in workflow_dispatch option lists.
        options:
          - all
          - freebsd
          - macos
      linux_distro:
        description: Linux distro to ingest (workflow_dispatch only)
        type: choice
        required: false
        default: all
        # Keep choices aligned with BETTERMAN_LINUX_DISTROS below; GitHub Actions
        # does not allow expressions in workflow_dispatch option lists.
        options:
          - all
          - debian
          - ubuntu
          - fedora
          - arch
          - alpine
      sample:
        description: Ingest a non-active sample release (workflow_dispatch only)
        type: boolean
        required: false
        default: false
      promote:
        description: Promote active staging releases to prod
        type: boolean
        required: false
        default: false
  schedule:
    # Monthly on the 1st at 05:00 UTC
    - cron: "0 5 1 * *"

concurrency:
  group: update-dataset
  cancel-in-progress: false

permissions:
  contents: read

# Canonical full-ingestion and promotion sets. The workflow_dispatch choices
# above must remain literal because GitHub does not support expressions there.
env:
  BETTERMAN_LINUX_DISTROS: debian,ubuntu,fedora,arch,alpine
  BETTERMAN_BSD_DISTROS: freebsd,macos

jobs:
  preflight:
    name: Validate ingestion configuration
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.ingest || inputs.promote }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 1
    steps:
      - name: Require protected Convex ingestion secrets
        env:
          CONVEX_HTTP_URL: ${{ secrets.BETTERMAN_CONVEX_HTTP_URL }}
          CONVEX_INGEST_SECRET: ${{ secrets.BETTERMAN_CONVEX_INGEST_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CONVEX_HTTP_URL:-}" || -z "${CONVEX_INGEST_SECRET:-}" ]]; then
            echo "Missing protected production environment secrets: BETTERMAN_CONVEX_HTTP_URL / BETTERMAN_CONVEX_INGEST_SECRET." >&2
            exit 1
          fi

  ingest_linux:
    name: Ingest Linux
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.ingest && inputs.linux) }}
    needs: [preflight]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 300
    env:
      BETTERMAN_INGEST_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Checkpoints contain public payloads/provenance and upload receipts only.
      # The restore prefix is bounded to this workflow run, never another release.
      - name: Set Linux checkpoint directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/betterman-ingestion/linux"
          echo "BETTERMAN_INGEST_STATE_DIR=${RUNNER_TEMP}/betterman-ingestion/linux" >> "$GITHUB_ENV"

      - name: Restore Linux ingestion checkpoints
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.BETTERMAN_INGEST_STATE_DIR }}
          key: ingestion-v1-linux-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ingestion-v1-linux-${{ github.run_id }}-

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: 3.14

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: cd ingestion && uv sync --frozen

      - name: Ingest to Convex staging
        id: ingest
        env:
          CONVEX_HTTP_URL: ${{ secrets.BETTERMAN_CONVEX_HTTP_URL }}
          CONVEX_INGEST_SECRET: ${{ secrets.BETTERMAN_CONVEX_INGEST_SECRET }}
          BETTERMAN_DATASET_STAGE: staging
          BETTERMAN_DEBIAN_IMAGE_REF: debian:trixie
          BETTERMAN_UBUNTU_IMAGE_REF: ubuntu:24.04
          BETTERMAN_FEDORA_IMAGE_REF: fedora:43
          BETTERMAN_ARCH_IMAGE_REF: archlinux:latest
          BETTERMAN_ALPINE_IMAGE_REF: alpine:3.22
          BETTERMAN_INGEST_SAMPLE: ${{ inputs.sample && 'true' || 'false' }}
          BETTERMAN_LINUX_DISTRO: ${{ inputs.linux_distro || 'all' }}
        shell: bash
        run: |
          set -euo pipefail

          cd ingestion

          ingest_args=(--activate)
          if [[ "${BETTERMAN_INGEST_SAMPLE}" == "true" ]]; then
            ingest_args=(--sample --no-activate)
          fi

          IFS=',' read -r -a available_distros <<< "${BETTERMAN_LINUX_DISTROS}"
          target="${BETTERMAN_LINUX_DISTRO:-all}"
          if [[ "${target}" == "all" ]]; then
            selected_distros=("${available_distros[@]}")
          elif [[ ",${BETTERMAN_LINUX_DISTROS}," == *",${target},"* ]]; then
            selected_distros=("${target}")
          else
            echo "Unsupported Linux distro target: ${target}" >&2
            exit 2
          fi

          for distro in "${selected_distros[@]}"; do
            echo "Ingesting ${distro}…"
            uv run python -m ingestion.cli ingest --distro "${distro}" \
              --release-id "gha-${BETTERMAN_INGEST_RUN_ID}-${distro}" "${ingest_args[@]}"
          done

      # A failed upload must save its partial receipts before the runner is lost.
      - name: Save Linux ingestion checkpoints
        if: ${{ always() && steps.ingest.outcome != '' && steps.ingest.outcome != 'skipped' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.BETTERMAN_INGEST_STATE_DIR }}
          key: ingestion-v1-linux-${{ github.run_id }}-${{ github.run_attempt }}

  ingest_macos:
    name: Ingest macOS
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.ingest && inputs.bsd && (inputs.bsd_distro == 'all' || inputs.bsd_distro == 'macos')) }}
    needs: [preflight]
    runs-on: macos-latest
    environment: production
    timeout-minutes: 60
    env:
      BETTERMAN_INGEST_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set macOS checkpoint directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/betterman-ingestion/macos"
          echo "BETTERMAN_INGEST_STATE_DIR=${RUNNER_TEMP}/betterman-ingestion/macos" >> "$GITHUB_ENV"

      - name: Restore macOS ingestion checkpoints
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.BETTERMAN_INGEST_STATE_DIR }}
          key: ingestion-v1-macos-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ingestion-v1-macos-${{ github.run_id }}-

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: 3.14

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: cd ingestion && uv sync --frozen

      - name: Ingest macOS (BSD) to Convex staging
        id: ingest
        env:
          CONVEX_HTTP_URL: ${{ secrets.BETTERMAN_CONVEX_HTTP_URL }}
          CONVEX_INGEST_SECRET: ${{ secrets.BETTERMAN_CONVEX_INGEST_SECRET }}
          BETTERMAN_DATASET_STAGE: staging
          BETTERMAN_INGEST_SAMPLE: ${{ inputs.sample && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail

          cd ingestion

          ingest_args=(--activate)
          if [[ "${BETTERMAN_INGEST_SAMPLE}" == "true" ]]; then
            ingest_args=(--sample --no-activate)
          fi

          echo "Ingesting macOS (BSD)…"
          uv run python -m ingestion.cli ingest --distro macos \
            --release-id "gha-${BETTERMAN_INGEST_RUN_ID}-macos" "${ingest_args[@]}"

      - name: Save macOS ingestion checkpoints
        if: ${{ always() && steps.ingest.outcome != '' && steps.ingest.outcome != 'skipped' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.BETTERMAN_INGEST_STATE_DIR }}
          key: ingestion-v1-macos-${{ github.run_id }}-${{ github.run_attempt }}

  ingest_freebsd:
    name: Ingest FreeBSD
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.ingest && inputs.bsd && (inputs.bsd_distro == 'all' || inputs.bsd_distro == 'freebsd')) }}
    needs: [preflight]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    env:
      BETTERMAN_INGEST_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set FreeBSD checkpoint directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/betterman-ingestion/freebsd"
          echo "BETTERMAN_INGEST_STATE_DIR=${RUNNER_TEMP}/betterman-ingestion/freebsd" >> "$GITHUB_ENV"

      - name: Restore FreeBSD ingestion checkpoints
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.BETTERMAN_INGEST_STATE_DIR }}
          key: ingestion-v1-freebsd-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ingestion-v1-freebsd-${{ github.run_id }}-

      # The VM action synchronizes the workspace, not runner.temp. Copy only
      # public checkpoints into that bridge; secrets remain environment-only.
      - name: Prepare FreeBSD checkpoint handoff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${BETTERMAN_INGEST_STATE_DIR}" "${GITHUB_WORKSPACE}/.betterman-ingestion/freebsd"
          cp -R "${BETTERMAN_INGEST_STATE_DIR}/." "${GITHUB_WORKSPACE}/.betterman-ingestion/freebsd/"

      - name: Ingest FreeBSD to Convex staging
        id: ingest
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1
        with:
          release: "15.0"
          envs: "CONVEX_HTTP_URL CONVEX_INGEST_SECRET BETTERMAN_DATASET_STAGE BETTERMAN_INGEST_GIT_SHA BETTERMAN_INGEST_SAMPLE BETTERMAN_INGEST_RUN_ID"
          sync: rsync
          copyback: true
          usesh: true
          run: |
            set -euo pipefail

            cd "$GITHUB_WORKSPACE"
            export BETTERMAN_INGEST_STATE_DIR="${GITHUB_WORKSPACE}/.betterman-ingestion/freebsd"

            pkg update -f
            pkg install -y python3

            py="python3"
            if ! $py -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 12) else 1)'; then
              echo "python3 is < 3.12; installing python312…"
              pkg install -y python312
              py="python3.12"
            fi

            if ! command -v cargo >/dev/null 2>&1; then
              echo "cargo not found; installing Rust toolchain (required to build pydantic-core)…"
              pkg install -y rust
            fi

            $py -m ensurepip --upgrade
            $py -m pip install --upgrade pip
            $py -m pip install ./ingestion

            set -- --activate
            if [ "${BETTERMAN_INGEST_SAMPLE}" = "true" ]; then
              set -- --sample --no-activate
            fi

            echo "Ingesting FreeBSD…"
            # Let the VM action copy back partial receipts even if ingestion
            # fails. The host step below restores the exact failure exit code.
            ingest_status=0
            $py -m ingestion.cli ingest --distro freebsd \
              --release-id "gha-${BETTERMAN_INGEST_RUN_ID}-freebsd" "$@" || ingest_status=$?
            printf '%s\n' "${ingest_status}" > "${GITHUB_WORKSPACE}/.betterman-ingestion/freebsd-status"
        env:
          CONVEX_HTTP_URL: ${{ secrets.BETTERMAN_CONVEX_HTTP_URL }}
          CONVEX_INGEST_SECRET: ${{ secrets.BETTERMAN_CONVEX_INGEST_SECRET }}
          BETTERMAN_DATASET_STAGE: staging
          BETTERMAN_INGEST_GIT_SHA: ${{ github.sha }}
          BETTERMAN_INGEST_SAMPLE: ${{ inputs.sample && 'true' || 'false' }}

      - name: Collect FreeBSD checkpoints and enforce ingestion result
        if: ${{ always() && steps.ingest.outcome != '' && steps.ingest.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          cp -R "${GITHUB_WORKSPACE}/.betterman-ingestion/freebsd/." "${BETTERMAN_INGEST_STATE_DIR}/"
          status_file="${GITHUB_WORKSPACE}/.betterman-ingestion/freebsd-status"
          if [[ ! -f "${status_file}" ]]; then
            echo "FreeBSD ingestion did not return a result; refusing to report success." >&2
            exit 1
          fi
          ingest_status="$(cat "${status_file}")"
          if [[ ! "${ingest_status}" =~ ^(0|[1-9][0-9]{0,2})$ ]] || (( ingest_status > 255 )); then
            echo "Invalid FreeBSD ingestion exit status." >&2
            exit 1
          fi
          exit "${ingest_status}"

      - name: Save FreeBSD ingestion checkpoints
        if: ${{ always() && steps.ingest.outcome != '' && steps.ingest.outcome != 'skipped' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.BETTERMAN_INGEST_STATE_DIR }}
          key: ingestion-v1-freebsd-${{ github.run_id }}-${{ github.run_attempt }}

  promote:
    name: Promote dataset
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    needs: [preflight, ingest_linux, ingest_macos, ingest_freebsd]
    # Unselected jobs and an explicit promote-only dispatch are skipped. Any
    # selected failure/cancellation blocks promotion, and samples never promote.
    if: >-
      ${{
        always() &&
        (github.event_name != 'workflow_dispatch' || inputs.promote) &&
        (github.event_name != 'workflow_dispatch' || !inputs.sample) &&
        needs.preflight.result == 'success' &&
        (needs.ingest_linux.result == 'success' || needs.ingest_linux.result == 'skipped') &&
        (needs.ingest_macos.result == 'success' || needs.ingest_macos.result == 'skipped') &&
        (needs.ingest_freebsd.result == 'success' || needs.ingest_freebsd.result == 'skipped')
      }}
    steps:
      - name: Promote active Convex staging releases to prod
        id: promote
        env:
          CONVEX_HTTP_URL: ${{ secrets.BETTERMAN_CONVEX_HTTP_URL }}
          CONVEX_INGEST_SECRET: ${{ secrets.BETTERMAN_CONVEX_INGEST_SECRET }}
          BETTERMAN_WORKFLOW_EVENT: ${{ github.event_name }}
          BETTERMAN_INGEST_ENABLED: ${{ inputs.ingest && 'true' || 'false' }}
          BETTERMAN_LINUX_ENABLED: ${{ inputs.linux && 'true' || 'false' }}
          BETTERMAN_LINUX_DISTRO: ${{ inputs.linux_distro || 'all' }}
          BETTERMAN_BSD_ENABLED: ${{ inputs.bsd && 'true' || 'false' }}
          BETTERMAN_BSD_DISTRO: ${{ inputs.bsd_distro || 'all' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CONVEX_HTTP_URL:-}" || -z "${CONVEX_INGEST_SECRET:-}" ]]; then
            echo "Missing BETTERMAN_CONVEX_HTTP_URL / BETTERMAN_CONVEX_INGEST_SECRET secrets."
            exit 1
          fi

          python - <<'PY' > promote.json
          import datetime
          import json
          import os

          linux_distros = os.environ["BETTERMAN_LINUX_DISTROS"].split(",")
          bsd_distros = os.environ["BETTERMAN_BSD_DISTROS"].split(",")

          is_dispatch = os.environ["BETTERMAN_WORKFLOW_EVENT"] == "workflow_dispatch"
          is_promote_only = is_dispatch and os.environ["BETTERMAN_INGEST_ENABLED"] != "true"

          if not is_dispatch or is_promote_only:
              distros = linux_distros + bsd_distros
          else:
              distros = []
              if os.environ["BETTERMAN_LINUX_ENABLED"] == "true":
                  target = os.environ["BETTERMAN_LINUX_DISTRO"]
                  distros.extend(linux_distros if target == "all" else [target])
              if os.environ["BETTERMAN_BSD_ENABLED"] == "true":
                  target = os.environ["BETTERMAN_BSD_DISTRO"]
                  distros.extend(bsd_distros if target == "all" else [target])

          if not distros:
              raise SystemExit("Refusing to promote without a selected distro")

          with open("promoted_distros.txt", "w") as fh:
              fh.write(",".join(distros))

          print(json.dumps({
              "fromStage": "staging",
              "toStage": "prod",
              "distros": distros,
              "activatedAt": datetime.datetime.now(datetime.UTC).isoformat(),
          }))
          PY

          curl -fsS \
            -X POST \
            -H "Authorization: Bearer ${CONVEX_INGEST_SECRET}" \
            -H "Content-Type: application/json" \
            --data @promote.json \
            "${CONVEX_HTTP_URL%/}/ingest/promote"

          echo "distros=$(cat promoted_distros.txt)" >> "$GITHUB_OUTPUT"

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.4

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify promoted production releases
        env:
          CONVEX_URL: ${{ vars.CONVEX_URL }}
          BETTERMAN_CHECK_DISTROS: ${{ steps.promote.outputs.distros }}
          BETTERMAN_MIN_PAGE_COUNT: 1
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CONVEX_URL:-}" ]]; then
            echo "CONVEX_URL is required in the protected production environment." >&2
            exit 1
          fi

          pnpm convex:prod-check
