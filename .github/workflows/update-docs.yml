name: update-dataset

on:
  workflow_dispatch:
    inputs:
      ingest:
        description: Run ingestion into staging DB
        type: boolean
        required: false
        default: true
      linux:
        description: Run Linux distro ingests (full Debian requires its separate opt-in)
        type: boolean
        required: false
        default: true
      bsd:
        description: Run BSD ingests (freebsd/macos)
        type: boolean
        required: false
        default: true
      bsd_distro:
        description: BSD distro to ingest (workflow_dispatch only)
        type: choice
        required: false
        default: all
        # Keep choices aligned with BSD in scripts/dataset-workflow.py; GitHub Actions
        # does not allow expressions in workflow_dispatch option lists.
        options:
          - all
          - freebsd
          - macos
      linux_distro:
        description: Linux distro to ingest (workflow_dispatch only)
        type: choice
        required: false
        default: all
        # Keep choices aligned with LINUX in scripts/dataset-workflow.py; GitHub Actions
        # does not allow expressions in workflow_dispatch option lists.
        options:
          - all
          - debian
          - ubuntu
          - fedora
          - arch
          - alpine
      sample:
        description: Ingest a non-active sample release (workflow_dispatch only)
        type: boolean
        required: false
        default: false
      debian_full:
        description: Explicitly authorize full Debian archive ingestion (shared execution and spend)
        type: boolean
        required: false
        default: false
      debian_full_promote:
        description: Explicitly authorize promotion of a held full Debian staging release
        type: boolean
        required: false
        default: false
      fedora_full:
        description: Explicitly authorize full Fedora RPM extraction to staging
        type: boolean
        required: false
        default: false
      fedora_full_promote:
        description: Explicitly authorize promotion of a held full Fedora staging release
        type: boolean
        required: false
        default: false
      ubuntu_full:
        description: Explicitly authorize full Ubuntu archive ingestion to staging
        type: boolean
        required: false
        default: false
      ubuntu_full_promote:
        description: Explicitly authorize promotion of a held full Ubuntu staging release
        type: boolean
        required: false
        default: false
      debian_download_only:
        description: Download-only Debian benchmark; no Convex, upload, activation or promotion
        type: boolean
        required: false
        default: false
      promote:
        description: Promote active staging releases to prod
        type: boolean
        required: false
        default: false
      expected_release_ids:
        description: 'Optional JSON map of distro to inspected release ID; listed distros must match before promotion'
        type: string
        required: false
        default: ''
  schedule:
    # Monthly on the 1st at 05:00 UTC
    - cron: "0 5 1 * *"

concurrency:
  group: update-dataset
  cancel-in-progress: false

permissions:
  contents: read

# Distro selection lives in scripts/dataset-workflow.py; keep the literal
# workflow_dispatch choices above aligned with its LINUX and BSD lists.

env:
  BETTERMAN_FEDORA_FULL: ${{ vars.BETTERMAN_FEDORA_FULL }}
  BETTERMAN_FEDORA_FULL_INPUT: ${{ inputs.fedora_full && 'true' || 'false' }}
  BETTERMAN_FEDORA_FULL_PROMOTE: ${{ vars.BETTERMAN_FEDORA_FULL_PROMOTE }}
  BETTERMAN_FEDORA_FULL_PROMOTE_INPUT: ${{ inputs.fedora_full_promote && 'true' || 'false' }}
  BETTERMAN_UBUNTU_FULL: ${{ vars.BETTERMAN_UBUNTU_FULL }}
  BETTERMAN_UBUNTU_FULL_INPUT: ${{ inputs.ubuntu_full && 'true' || 'false' }}
  BETTERMAN_UBUNTU_FULL_PROMOTE: ${{ vars.BETTERMAN_UBUNTU_FULL_PROMOTE }}
  BETTERMAN_UBUNTU_FULL_PROMOTE_INPUT: ${{ inputs.ubuntu_full_promote && 'true' || 'false' }}
  BETTERMAN_DEBIAN_FULL: ${{ vars.BETTERMAN_DEBIAN_FULL }}
  BETTERMAN_DEBIAN_FULL_INPUT: ${{ inputs.debian_full && 'true' || 'false' }}
  BETTERMAN_DEBIAN_FULL_PROMOTE: ${{ vars.BETTERMAN_DEBIAN_FULL_PROMOTE }}
  BETTERMAN_DEBIAN_FULL_PROMOTE_INPUT: ${{ inputs.debian_full_promote && 'true' || 'false' }}
  BETTERMAN_DEBIAN_DOWNLOAD_ONLY: ${{ inputs.debian_download_only && 'true' || 'false' }}
  BETTERMAN_WORKFLOW_EVENT: ${{ github.event_name }}
  BETTERMAN_INGEST_ENABLED: ${{ inputs.ingest && 'true' || 'false' }}
  BETTERMAN_PROMOTE_ENABLED: ${{ inputs.promote && 'true' || 'false' }}
  BETTERMAN_EXPECTED_RELEASE_IDS_INPUT: ${{ inputs.expected_release_ids || '' }}
  BETTERMAN_INGEST_SAMPLE: ${{ inputs.sample && 'true' || 'false' }}
  BETTERMAN_LINUX_ENABLED: ${{ inputs.linux && 'true' || 'false' }}
  BETTERMAN_LINUX_DISTRO: ${{ inputs.linux_distro || 'all' }}
  BETTERMAN_BSD_ENABLED: ${{ inputs.bsd && 'true' || 'false' }}
  BETTERMAN_BSD_DISTRO: ${{ inputs.bsd_distro || 'all' }}

jobs:
  debian_download_only:
    name: Debian download-only benchmark (no uploads)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.debian_download_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Reserve time to save verified downloads and report
        run: echo "BETTERMAN_INGEST_DEADLINE_UNIX_SECONDS=$(( $(date +%s) + 297 * 60 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: 3.14
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/betterman-debian/archives/*.deb
          key: debian-debs-ed56aac47e7911e65ee63aae8d67e29f20e023f840e49f8ed037043a33de138a
      - name: Acquire only; never create a Convex client
        env:
          BETTERMAN_DEBIAN_CACHE_DIR: ${{ runner.temp }}/betterman-debian/archives
        run: uv run --directory ingestion python -m scripts.check_debian_archives --workdir "${RUNNER_TEMP}/betterman-debian/workspace" --packages 2000 --download-only
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ always() }}
        with:
          path: ${{ runner.temp }}/betterman-debian/archives/*.deb
          key: debian-debs-ed56aac47e7911e65ee63aae8d67e29f20e023f840e49f8ed037043a33de138a
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debian-download-only-report
          path: ${{ runner.temp }}/betterman-debian/workspace/download-only.json
          retention-days: 14

  preflight:
    name: Validate ingestion configuration
    if: ${{ !inputs.debian_download_only && (github.event_name != 'workflow_dispatch' || inputs.ingest || inputs.promote) }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 1
    steps:
      - name: Require protected Convex ingestion secrets
        env:
          CONVEX_HTTP_URL: ${{ secrets.BETTERMAN_CONVEX_HTTP_URL }}
          CONVEX_INGEST_SECRET: ${{ secrets.BETTERMAN_CONVEX_INGEST_SECRET }}
          CONVEX_URL: ${{ vars.CONVEX_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CONVEX_HTTP_URL:-}" || -z "${CONVEX_INGEST_SECRET:-}" || -z "${CONVEX_URL:-}" ]]; then
            echo "Missing production environment secrets BETTERMAN_CONVEX_HTTP_URL / BETTERMAN_CONVEX_INGEST_SECRET or CONVEX_URL variable." >&2
            exit 1
          fi

  plan:
    name: Select distros
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      enabled: ${{ steps.plan.outputs.enabled }}
      ingest: ${{ steps.plan.outputs.ingest }}
      promote: ${{ steps.plan.outputs.promote }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select requested distros and operations
        id: plan
        run: python3 scripts/dataset-workflow.py plan

  ingest:
    name: Dataset (${{ matrix.distro }})
    needs: [preflight, plan]
    if: ${{ needs.plan.outputs.enabled == 'true' }}
    strategy:
      fail-fast: false
      # Bound Docker/VM load and production upload concurrency.
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    environment: production
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - name: Reserve time for dataset reporting
        id: activation_deadline
        if: ${{ needs.plan.outputs.ingest == 'true' }}
        shell: bash
        env:
          BETTERMAN_JOB_TIMEOUT_MINUTES: ${{ matrix.timeout }}
        run: |
          # Start before setup, Docker pulls or VM boot. Leave 3 minutes for
          # promotion checks, result recording and artifact upload.
          echo "BETTERMAN_INGEST_DEADLINE_UNIX_SECONDS=$(( $(date +%s) + BETTERMAN_JOB_TIMEOUT_MINUTES * 60 - 180 ))" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: 3.14

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ matrix.promote }}
        with:
          version: 10.34.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        if: ${{ matrix.promote }}
        with:
          node-version: 26
          cache: pnpm
      # Preserve the promotion job's no-lifecycle-scripts install policy.
      - name: Install verification dependencies
        id: verification_dependencies
        if: ${{ matrix.promote }}
        run: python3 scripts/dataset-workflow.py run "${DISTRO}" verification-setup pnpm install --frozen-lockfile --ignore-scripts
        env:
          DISTRO: ${{ matrix.distro }}

      # Secret-bearing job: 'auto' would enable the cache here.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: ${{ needs.plan.outputs.ingest == 'true' && matrix.distro != 'freebsd' }}
        with:
          enable-cache: false
      - name: Install ingestion dependencies
        id: dependencies
        if: ${{ needs.plan.outputs.ingest == 'true' && matrix.distro != 'freebsd' }}
        run: python3 scripts/dataset-workflow.py run "${DISTRO}" setup uv sync --frozen --project ingestion
        env:
          DISTRO: ${{ matrix.distro }}

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ matrix.full_debian }}
        with:
          path: ${{ runner.temp }}/betterman-debian/archives/*.deb
          key: debian-debs-ed56aac47e7911e65ee63aae8d67e29f20e023f840e49f8ed037043a33de138a

      - name: Install Debian archive renderer
        id: debian_renderer
        if: ${{ needs.plan.outputs.ingest == 'true' && matrix.full_debian }}
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends mandoc

      - name: Install Fedora archive readers
        id: fedora_renderer
        if: ${{ needs.plan.outputs.ingest == 'true' && matrix.full_fedora }}
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends mandoc libarchive-tools

      - name: Install Ubuntu archive renderer
        id: ubuntu_renderer
        if: ${{ needs.plan.outputs.ingest == 'true' && matrix.full_ubuntu }}
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends mandoc

      - name: Ingest to Convex staging
        id: staging
        if: ${{ needs.plan.outputs.ingest == 'true' && matrix.distro != 'freebsd' }}
        env:
          DISTRO: ${{ matrix.distro }}
          CONVEX_HTTP_URL: ${{ secrets.BETTERMAN_CONVEX_HTTP_URL }}
          CONVEX_INGEST_SECRET: ${{ secrets.BETTERMAN_CONVEX_INGEST_SECRET }}
          BETTERMAN_DATASET_STAGE: staging
          BETTERMAN_INGEST_SAMPLE: ${{ inputs.sample && 'true' || 'false' }}
          BETTERMAN_INGEST_GIT_SHA: ${{ github.sha }}
          BETTERMAN_DEBIAN_FULL_SELECTED: ${{ matrix.full_debian }}
          BETTERMAN_FEDORA_FULL_SELECTED: ${{ matrix.full_fedora }}
          BETTERMAN_FEDORA_WORKDIR: ${{ runner.temp }}/betterman-fedora/workspace
          BETTERMAN_FEDORA_CACHE_DIR: ${{ runner.temp }}/betterman-fedora/archives
          BETTERMAN_UBUNTU_FULL_SELECTED: ${{ matrix.full_ubuntu }}
          BETTERMAN_UBUNTU_WORKDIR: ${{ runner.temp }}/betterman-ubuntu/workspace
          BETTERMAN_UBUNTU_CACHE_DIR: ${{ runner.temp }}/betterman-ubuntu/archives
          BETTERMAN_DEBIAN_WORKDIR: ${{ runner.temp }}/betterman-debian/workspace
          BETTERMAN_DEBIAN_CACHE_DIR: ${{ runner.temp }}/betterman-debian/archives
        shell: bash
        run: |
          set -euo pipefail
          ingest_args=(--activate)
          if [[ "${BETTERMAN_INGEST_SAMPLE}" == "true" ]]; then
            ingest_args=(--sample --no-activate)
          fi
          if [[ "${BETTERMAN_DEBIAN_FULL_SELECTED}" == "true" ]]; then
            ingest_args+=(--debian-full)
          fi
          if [[ "${BETTERMAN_FEDORA_FULL_SELECTED}" == "true" ]]; then
            ingest_args+=(--fedora-full)
          fi
          if [[ "${BETTERMAN_UBUNTU_FULL_SELECTED}" == "true" ]]; then
            ingest_args+=(--ubuntu-full)
          fi
          python3 scripts/dataset-workflow.py run "${DISTRO}" ingest \
            uv run --directory ingestion python -m ingestion.cli ingest --distro "${DISTRO}" "${ingest_args[@]}"

      - name: Ingest FreeBSD to Convex staging
        id: freebsd
        if: ${{ needs.plan.outputs.ingest == 'true' && matrix.distro == 'freebsd' }}
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1
        with:
          # pkg builds for the newest 15.x minor; bump when a new minor ships.
          release: "15.1"
          envs: "CONVEX_HTTP_URL CONVEX_INGEST_SECRET BETTERMAN_DATASET_STAGE BETTERMAN_INGEST_GIT_SHA BETTERMAN_INGEST_SAMPLE BETTERMAN_INGEST_DEADLINE_UNIX_SECONDS"
          usesh: true
          run: |
            set -euo pipefail
            cd "$GITHUB_WORKSPACE"
            mkdir -p dataset-results
            # Copyback only runs after a zero VM exit; the host checks this record.
            printf '%s\n' '{"distro":"freebsd","stage":"setup","result":"failure","error":"FreeBSD pkg/Python/Rust bootstrap failed; see VM log"}' > dataset-results/freebsd.json
            trap 'exit 0' EXIT
            pkg update -f
            pkg install -y python3
            py="python3"
            if ! $py -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 12) else 1)'; then
              pkg install -y python312
              py="python3.12"
            fi
            if ! command -v cargo >/dev/null 2>&1; then
              pkg install -y rust
            fi
            $py -m ensurepip --upgrade
            $py -m pip install --upgrade pip
            $py scripts/dataset-workflow.py run freebsd setup $py -m pip install ./ingestion
            set -- --activate
            if [ "${BETTERMAN_INGEST_SAMPLE}" = "true" ]; then
              set -- --sample --no-activate
            fi
            # Run checkout sources so B4's checksum-pinned data accompanies the module.
            export PYTHONPATH="$GITHUB_WORKSPACE/ingestion${PYTHONPATH:+:$PYTHONPATH}"
            $py scripts/dataset-workflow.py run freebsd ingest $py -m ingestion.cli ingest --distro freebsd "$@"
        env:
          CONVEX_HTTP_URL: ${{ secrets.BETTERMAN_CONVEX_HTTP_URL }}
          CONVEX_INGEST_SECRET: ${{ secrets.BETTERMAN_CONVEX_INGEST_SECRET }}
          BETTERMAN_DATASET_STAGE: staging
          BETTERMAN_INGEST_GIT_SHA: ${{ github.sha }}
          BETTERMAN_INGEST_SAMPLE: ${{ inputs.sample && 'true' || 'false' }}

      - name: Require copied-back FreeBSD result
        id: freebsd_result
        if: ${{ needs.plan.outputs.ingest == 'true' && matrix.distro == 'freebsd' }}
        run: python3 scripts/dataset-workflow.py check freebsd

      # The helper checks the deployed contract, obtains a verified staging ID
      # even on promotion-only dispatches, and sends it as the CAS expectation.
      - name: Promote this distro's verified staging release (compare-and-swap)
        id: promote
        if: ${{ matrix.promote }}
        env:
          DISTRO: ${{ matrix.distro }}
          CONVEX_HTTP_URL: ${{ secrets.BETTERMAN_CONVEX_HTTP_URL }}
          CONVEX_INGEST_SECRET: ${{ secrets.BETTERMAN_CONVEX_INGEST_SECRET }}
          BETTERMAN_INGEST_ENABLED: ${{ needs.plan.outputs.ingest }}
          CONVEX_URL: ${{ vars.CONVEX_URL }}
        run: python3 scripts/dataset-workflow.py promote "${DISTRO}"

      - name: Verify promoted production release
        id: verify_prod
        if: ${{ matrix.promote && steps.promote.outputs.skipped != 'true' }}
        env:
          DISTRO: ${{ matrix.distro }}
          CONVEX_URL: ${{ vars.CONVEX_URL }}
          BETTERMAN_CHECK_DISTROS: ${{ matrix.distro }}
          BETTERMAN_EXPECTED_RELEASE_IDS: ${{ steps.promote.outputs.release_ids }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${BETTERMAN_EXPECTED_RELEASE_IDS}"
          python3 scripts/dataset-workflow.py run "${DISTRO}" prod-verified pnpm convex:prod-check

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ always() && matrix.full_debian }}
        with:
          path: ${{ runner.temp }}/betterman-debian/archives/*.deb
          key: debian-debs-ed56aac47e7911e65ee63aae8d67e29f20e023f840e49f8ed037043a33de138a

      - name: Record distro result
        if: ${{ always() }}
        env:
          DISTRO: ${{ matrix.distro }}
          BETTERMAN_JOB_STATUS: ${{ job.status }}
          BETTERMAN_STEPS: ${{ toJSON(steps) }}
        run: python3 scripts/dataset-workflow.py finish "${DISTRO}"
      - name: Upload sanitized distro result
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dataset-result-${{ matrix.distro }}
          path: dataset-results/${{ matrix.distro }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  summary:
    name: Dataset summary
    needs: [preflight, plan, ingest]
    if: ${{ always() && (needs.plan.outputs.enabled == 'true' || needs.plan.result == 'failure' || needs.plan.result == 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download distro results
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dataset-result-*
          path: dataset-results
          merge-multiple: true
      - name: Report all selected distros and fail on any failure
        if: ${{ always() }}
        env:
          BETTERMAN_MATRIX: ${{ needs.plan.outputs.matrix }}
          BETTERMAN_MATRIX_RESULT: ${{ needs.ingest.result }}
          BETTERMAN_PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          BETTERMAN_PLAN_RESULT: ${{ needs.plan.result }}
        run: python3 scripts/dataset-workflow.py summary
