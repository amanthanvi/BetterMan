name: verify-smoke

# Optional manual smoke. Not part of the required checks in ci.yml.
# Run it from the Actions tab. It launches a local Convex deployment, seeds the
# E2E fixture, and runs doctor plus the short Playwright smoke.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify_smoke:
    name: verify_smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install tmux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends tmux

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        shell: bash
        run: bash scripts/install-playwright-ci.sh

      - name: Launch and smoke
        env:
          CONVEX_AGENT_MODE: anonymous
          VERIFY_SKIP_BROWSER_INSTALL: "1"
        run: |
          set -euo pipefail
          node .agents/skills/verify-betterman/scripts/launch.mjs
          pnpm verify:doctor
          pnpm verify:smoke

      - name: Cleanup
        if: always()
        run: node .agents/skills/verify-betterman/scripts/cleanup.mjs
