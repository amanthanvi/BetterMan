name: prune-releases

# Removes sealed, inactive dataset releases that can no longer serve as
# rollback targets in bounded Convex batches, then sweeps orphan blobs, manifest
# files and derived caches. sweep_only skips release operations; selected sweeps
# can resume from checkpoints. Dry run by default; set apply=true to delete.
# Shares the update-dataset concurrency group so it never overlaps ingestion or
# promotion. Do not dispatch while a manual /ingest/activate rollback is in
# progress: pruning marks a release before deleting it and that mark is final.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Delete the selected releases (false previews only)
        type: boolean
        required: false
        default: false
      keep_per_distro:
        description: Verified inactive releases to retain per distro as rollback candidates
        type: string
        required: false
        default: "1"
      min_age_hours:
        description: Only prune declared releases created at least this many hours ago (minimum 1)
        type: string
        required: false
        default: "24"
      unsealed_min_age_hours:
        description: Also prune unsealed drafts older than this many hours (0 keeps all unsealed drafts)
        type: string
        required: false
        default: "0"
      sweep_orphans:
        description: Sweep orphaned content blobs (walks the whole blob table; defaults to apply)
        type: choice
        required: false
        default: auto
        options:
          - auto
          - "true"
          - "false"

      sweep_only:
        description: Skip release deletion and preview; sweep even in dry run
        type: boolean
        default: false
      sweep:
        description: Tables to sweep (a selection requires sweep_only=true)
        type: choice
        default: all
        options:
          - all
          - blobs
          - manifests
          - derivedSignatureCache
          - derivedLegacySignatures
          - manPageSymbols
      start_cursor:
        description: Non-null resume cursor from sweep_progress (requires sweep_only and one sweep)
        type: string
        required: false

concurrency:
  group: update-dataset
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prune:
    name: Prune inactive releases
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify trusted tooling provenance
        run: pnpm deps:provenance

      - name: Prune inactive releases
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_URL: ${{ vars.CONVEX_URL }}
          BETTERMAN_PRUNE_SWEEP_ONLY: ${{ inputs.sweep_only && 'true' || 'false' }}
          BETTERMAN_PRUNE_SWEEP: ${{ inputs.sweep }}
          BETTERMAN_PRUNE_START_CURSOR: ${{ inputs.start_cursor }}
          BETTERMAN_PRUNE_APPLY: ${{ inputs.apply && 'true' || 'false' }}
          BETTERMAN_PRUNE_KEEP_PER_DISTRO: ${{ inputs.keep_per_distro }}
          BETTERMAN_PRUNE_MIN_AGE_HOURS: ${{ inputs.min_age_hours }}
          BETTERMAN_PRUNE_UNSEALED_MIN_AGE_HOURS: ${{ inputs.unsealed_min_age_hours }}
          BETTERMAN_PRUNE_SWEEP_ORPHANS: ${{ inputs.sweep_orphans != 'auto' && inputs.sweep_orphans || '' }}
        run: |
          # An omitted workflow input arrives as empty; do not pass it as a cursor.
          if [ -z "$BETTERMAN_PRUNE_START_CURSOR" ]; then unset BETTERMAN_PRUNE_START_CURSOR; fi
          pnpm convex:prune-releases
