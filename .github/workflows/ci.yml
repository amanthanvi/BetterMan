name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency_review:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
          # GHSA-mh99-v99m-4gvg (brace-expansion) declares its vulnerable range
          # as "<=5.0.7", which by semver comparison also matches 1.1.16 and
          # 2.1.2 -- the releases that carry the fix for their own major lines.
          # eslint's minimatch needs the 1.x/2.x API, so there is no version
          # that both satisfies the range and works: forcing 5.0.8 into those
          # slots makes eslint die with "TypeError: expand is not a function".
          # Revisit when minimatch moves to a brace-expansion line the advisory
          # does not cover, and drop this line then.
          allow-ghsas: GHSA-mh99-v99m-4gvg

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.4

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -C frontend lint
      - run: pnpm -C frontend test
      - run: pnpm -C frontend build
      - run: pnpm -C frontend bundle:report

  nextjs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.4

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm next:grammar
      - run: pnpm next:test
      - run: pnpm -C nextjs lint
      - run: pnpm -C nextjs build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: 3.14

      - run: pipx install uv
      - run: cd backend && uv sync --frozen
      - run: cd backend && uv run ruff check .
      - run: cd backend && uv run ruff format --check .
      - run: cd backend && uv run pytest

  ingestion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: 3.14

      - run: pipx install uv
      - run: cd ingestion && uv sync --frozen
      - run: cd ingestion && uv run ruff check .
      - run: cd ingestion && uv run ruff format --check .
      - run: cd ingestion && uv run python -m pytest

  api_types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.4

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 26
          cache: pnpm

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: 3.14

      - run: pnpm install --frozen-lockfile

      - run: pipx install uv
      - run: cd backend && uv sync --frozen

      - name: OpenAPI types are up to date
        run: |
          set -euo pipefail

          cd backend
          uv run python scripts/export_openapi.py /tmp/betterman-openapi.json

          cd ..
          pnpm -C frontend exec openapi-typescript /tmp/betterman-openapi.json --output src/api/openapi.gen.ts
          pnpm -C nextjs exec openapi-typescript /tmp/betterman-openapi.json --output lib/openapi.gen.ts

          git diff --exit-code frontend/src/api/openapi.gen.ts
          git diff --exit-code nextjs/lib/openapi.gen.ts

  container_build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build legacy web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          push: false
          pull: true
          tags: betterman-web:ci
          cache-from: type=gha,scope=betterman-web
          cache-to: type=gha,mode=max,scope=betterman-web

      - name: Build Next.js image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: nextjs/Dockerfile
          push: false
          pull: true
          tags: betterman-nextjs:ci
          cache-from: type=gha,scope=betterman-nextjs
          cache-to: type=gha,mode=max,scope=betterman-nextjs

  e2e:
    needs:
      - frontend
      - nextjs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.4

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2; do
            if timeout 300s pnpm -C frontend exec playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Playwright browser install failed or timed out (attempt ${attempt}/2)." >&2
            sleep $((attempt * 5))
          done

          exit 1

      - name: Provision local Convex + seed E2E data
        env:
          CONVEX_AGENT_MODE: anonymous
          BETTERMAN_E2E_SEED: "1"
          BETTERMAN_DATASET_STAGE: prod
          CONVEX_INGEST_SECRET: e2e-secret
        run: |
          set -euo pipefail

          npx convex dev --once
          npx convex env set CONVEX_INGEST_SECRET "$CONVEX_INGEST_SECRET"

          nohup npx convex dev --tail-logs disable > /tmp/betterman-convex.log 2>&1 &
          echo $! > /tmp/betterman-convex.pid

          for _ in {1..60}; do
            if grep -q "Convex functions ready" /tmp/betterman-convex.log; then
              break
            fi
            sleep 1
          done

          if ! grep -q "Convex functions ready" /tmp/betterman-convex.log; then
            echo "Timed out waiting for Convex"
            tail -n 200 /tmp/betterman-convex.log || true
            exit 1
          fi

          set -a
          # shellcheck disable=SC1091
          . ./.env.local
          set +a

          CONVEX_HTTP_URL="$CONVEX_SITE_URL" node scripts/seed-convex-e2e.mjs

      - name: Start Next.js
        env:
          BETTERMAN_DATASET_STAGE: prod
        run: |
          set -euo pipefail

          set -a
          # shellcheck disable=SC1091
          . ./.env.local
          set +a

          export NEXT_PUBLIC_CONVEX_URL="$CONVEX_URL"
          export CONVEX_URL="$CONVEX_URL"
          export CONVEX_INGEST_SECRET="e2e-secret"

          pnpm -C nextjs build

          nohup pnpm -C nextjs exec next start -p 3000 > /tmp/betterman-next.log 2>&1 &

          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/robots.txt >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          echo "Timed out waiting for Next.js"
          tail -n 200 /tmp/betterman-next.log || true
          exit 1

      - name: Run Playwright E2E + a11y
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: pnpm -C frontend e2e
