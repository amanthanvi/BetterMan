name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci_contracts:
    name: ci_contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # actions: read queries workflow activation; contents: read checks out source.
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 26

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: 3.14

      - name: Test Playwright installer failure handling
        run: bash scripts/test-install-playwright-ci.sh

      - name: Check bounded OSV exceptions
        run: node scripts/check-osv-exceptions.mjs

      - name: Check public Convex release isolation
        run: node scripts/check-convex-public-api.mjs

      - name: Test production completion checks
        run: pnpm ops:test

      - name: Check monthly dataset workflow is active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cron_count="$(grep -Ec "^[[:space:]]*-[[:space:]]*cron:[[:space:]]*['\"]?0[[:space:]]+5[[:space:]]+1[[:space:]]+\\*[[:space:]]+\\*['\"]?([[:space:]]*#.*)?$" .github/workflows/update-docs.yml || true)"
          if [[ "$cron_count" != "1" ]]; then
            echo 'update-dataset must retain exactly one monthly cron: 0 5 1 * *' >&2
            exit 1
          fi

          state="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/update-docs.yml" \
            --jq .state)"
          if [[ "$state" != "active" ]]; then
            echo "update-dataset workflow is ${state:-unknown}; re-enable the monthly schedule." >&2
            exit 1
          fi

  dependency_review:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # GHSA-mh99-v99m-4gvg (brace-expansion) declares its vulnerable range
          # as "<=5.0.7", which by semver comparison also matches 1.1.16 and
          # 2.1.2 -- the releases that carry the fix for their own major lines.
          # eslint's minimatch needs the 1.x/2.x API, so there is no version
          # that both satisfies the range and works: forcing 5.0.8 into those
          # slots makes eslint die with "TypeError: expand is not a function".
          # Revisit when minimatch moves to a brace-expansion line the advisory
          # does not cover, and drop this line then.
          allow-ghsas: GHSA-mh99-v99m-4gvg


  nextjs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm deps:provenance
      - run: pnpm convex:test
      - run: pnpm convex:typecheck
      - run: pnpm next:grammar
      - run: pnpm next:test
      - run: pnpm -C nextjs lint
      - run: pnpm -C nextjs build


  ingestion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: 3.14

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends mandoc
      - run: cd ingestion && uv sync --frozen
      - run: cd ingestion && uv run ruff check .
      - run: cd ingestion && uv run ruff format --check .
      - run: cd ingestion && uv run python -m pytest
      # Distro containers and the FreeBSD job install the package with pip.
      - name: Check the package installs with pip
        run: python -m pip install --dry-run --quiet ./ingestion

  performance_budgets:
    runs-on: ubuntu-latest
    # Same bounded mirror prefetch/install allowance as E2E; measurements take about a minute.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/setup-playwright

      - run: pnpm ops:test
      - run: pnpm perf:check

      - name: Upload budget measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-budgets
          path: .perf-results/measurements.json
          if-no-files-found: ignore


  container_build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build Next.js image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: nextjs/Dockerfile
          push: false
          pull: true
          tags: betterman-nextjs:ci
          cache-from: type=gha,scope=betterman-nextjs
          cache-to: type=gha,mode=max,scope=betterman-nextjs

  e2e:
    needs:
      - nextjs
    runs-on: ubuntu-latest
    # Covers a 15-minute prefetch plus the installer's retries (about 12 minutes).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/setup-playwright

      - name: Provision local Convex + seed E2E data
        env:
          CONVEX_AGENT_MODE: anonymous
          BETTERMAN_E2E_SEED: "1"
          BETTERMAN_DATASET_STAGE: prod
          CONVEX_INGEST_SECRET: e2e-secret
          RATE_LIMIT_TAG_KEY: e2e-rate-limit-key
        run: |
          set -euo pipefail

          npx convex dev --once
          # convex dev regenerated convex/_generated; the committed copy must match
          # it. The AI guideline files under ai/ come from `convex ai-files` instead.
          drift="$(git status --porcelain -- convex/_generated ':(exclude)convex/_generated/ai')"
          if [[ -n "$drift" ]]; then
            echo "::error::convex/_generated is out of date. Run pnpm convex:check and commit convex/_generated." >&2
            echo "$drift" >&2
            git diff --stat -- convex/_generated >&2
            exit 1
          fi
          npx convex env set CONVEX_INGEST_SECRET "$CONVEX_INGEST_SECRET"
          npx convex env set RATE_LIMIT_TAG_KEY "$RATE_LIMIT_TAG_KEY"

          nohup npx convex dev --tail-logs disable > /tmp/betterman-convex.log 2>&1 &
          echo $! > /tmp/betterman-convex.pid

          for _ in {1..60}; do
            if grep -q "Convex functions ready" /tmp/betterman-convex.log; then
              break
            fi
            sleep 1
          done

          if ! grep -q "Convex functions ready" /tmp/betterman-convex.log; then
            echo "Timed out waiting for Convex"
            tail -n 200 /tmp/betterman-convex.log || true
            exit 1
          fi

          set -a
          # shellcheck disable=SC1091
          . ./.env.local
          set +a

          CONVEX_HTTP_URL="${CONVEX_SITE_URL:-$VITE_CONVEX_SITE_URL}" node scripts/seed-convex-e2e.mjs

      - name: Start Next.js
        run: |
          set -euo pipefail

          set -a
          # shellcheck disable=SC1091
          . ./.env.local
          set +a

          export CONVEX_URL="${CONVEX_URL:-$VITE_CONVEX_URL}"
          export NEXT_PUBLIC_CONVEX_URL="$CONVEX_URL"
          export CONVEX_INGEST_SECRET="e2e-secret"
          export RATE_LIMIT_TAG_KEY="e2e-rate-limit-key"
          export PUBLIC_BASE_URL="http://127.0.0.1:3000"
          # Concept explainers ship unapproved; e2e renders the drafts. The flag needs CI=true (set by
          # GitHub Actions) or a Vercel preview; production and the Docker image ignore it.
          export BETTERMAN_CONCEPT_DRAFTS=1

          pnpm -C nextjs build

          nohup pnpm -C nextjs exec next start -p 3000 > /tmp/betterman-next.log 2>&1 &

          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/robots.txt >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          echo "Timed out waiting for Next.js"
          tail -n 200 /tmp/betterman-next.log || true
          exit 1

      - name: Run Playwright E2E + a11y
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: pnpm -C nextjs e2e
