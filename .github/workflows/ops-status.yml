name: ops-status

# Read-only production status for operators without a local deploy key. It runs
# the existing check scripts, which query production and print only their own
# allowlisted fields. Nothing is written, ingested or deployed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-status
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install application dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify trusted tooling provenance
        run: pnpm deps:provenance

      # Exits nonzero while a build is pending or unhealthy; the printed status
      # is the answer either way.
      - name: Derived data status
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: pnpm convex:derived-check --prod

      - name: Task phrase status
        # Task-phrase search rows per active release; also nonzero until complete.
        if: always()
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: pnpm convex:task-check --prod
