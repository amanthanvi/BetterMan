name: deploy-vercel

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-character SHA from main history to deploy or roll back to"
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve_revision:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.revision.outputs.ref }}
      sha: ${{ steps.revision.outputs.sha }}
      require_current_main: ${{ steps.revision.outputs.require_current_main }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate deployment revision
        id: revision
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SHA: ${{ inputs.sha }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            sha="$WORKFLOW_SHA"
            ref="main"
            require_current_main="true"
          else
            sha="$MANUAL_SHA"
            ref="main-history"
            require_current_main="false"

            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Manual deployment requires a full lowercase 40-character commit SHA." >&2
              exit 1
            fi
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              echo "Commit ${sha} is not present in repository history." >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$sha" origin/main; then
              echo "Commit ${sha} is not reachable from protected main." >&2
              exit 1
            fi
          fi

          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Resolved deployment revision is not a full commit SHA." >&2
            exit 1
          fi

          {
            printf 'ref=%s\n' "$ref"
            printf 'sha=%s\n' "$sha"
            printf 'require_current_main=%s\n' "$require_current_main"
          } >> "$GITHUB_OUTPUT"

  deploy_production:
    needs: resolve_revision
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-vercel-production
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment_url }}
    env:
      BETTERMAN_DEPLOY_REF: ${{ needs.resolve_revision.outputs.ref }}
      BETTERMAN_DEPLOY_SHA: ${{ needs.resolve_revision.outputs.sha }}
      BETTERMAN_PRODUCTION_DOMAIN: betterman.sh
      BETTERMAN_REQUIRE_CURRENT_MAIN: ${{ needs.resolve_revision.outputs.require_current_main }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main
          path: tooling
          persist-credentials: false

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.resolve_revision.outputs.sha }}
          path: app
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.34.4

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install application dependencies
        run: pnpm install --frozen-lockfile

      - name: Require current main before Convex deployment
        if: needs.resolve_revision.outputs.require_current_main == 'true'
        shell: bash
        run: |
          set -euo pipefail

          current_main_sha="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          if [[ "$current_main_sha" != "$BETTERMAN_DEPLOY_SHA" ]]; then
            echo "Refusing to deploy stale Convex functions: selected ${BETTERMAN_DEPLOY_SHA}, current main ${current_main_sha}." >&2
            exit 1
          fi

      - name: Deploy current Convex functions
        if: needs.resolve_revision.outputs.require_current_main == 'true'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [[ -z "$CONVEX_DEPLOY_KEY" ]]; then
            echo "CONVEX_DEPLOY_KEY is required in the protected production environment." >&2
            exit 1
          fi
          pnpm exec convex deploy \
            --typecheck enable \
            --codegen disable \
            --message "GitHub Actions ${BETTERMAN_DEPLOY_SHA}"

      - name: Verify production Convex contract
        env:
          CONVEX_URL: ${{ vars.CONVEX_URL }}
          BETTERMAN_DATASET_STAGE: prod
          BETTERMAN_CHECK_DISTROS: debian
          BETTERMAN_MIN_PAGE_COUNT: 1
        run: |
          if [[ -z "$CONVEX_URL" ]]; then
            echo "CONVEX_URL is required in the protected production environment." >&2
            exit 1
          fi
          ln -s "$GITHUB_WORKSPACE/app/node_modules" "$GITHUB_WORKSPACE/tooling/node_modules"
          node "$GITHUB_WORKSPACE/tooling/scripts/check-convex-production.mjs"

      - name: Install Vercel CLI
        run: npm install --global vercel@58.4.4

      - name: Deploy and verify production
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          "$GITHUB_WORKSPACE/tooling/scripts/deploy-vercel.sh"
